<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Resin OS | The Ultimate Operating System for Epoxy Contractors</title>
    <meta name="description" content="The all-in-one platform to scale your epoxy business. Generate interactive quotes, collect digital signatures, process payments, and visualize floors with AI." />
    <meta name="author" content="Resin OS" />
    <meta name="keywords" content="epoxy software, epoxy contractor app, resin flooring quoting, floor coating business software, epoxy CRM, contractor operating system" />
    <link rel="canonical" href="https://resinacademics.com" />

    <!-- Open Graph / Social Media / iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://resinacademics.com" />
    <meta property="og:title" content="Resin OS: Close More Epoxy Jobs." />
    <meta property="og:description" content="Stop writing quotes on paper. Generate interactive proposals, collect deposits securely, and manage your entire epoxy business from one dashboard." />
    <meta property="og:image" content="https://resinacademics.com/logo.png" />
    <meta property="og:site_name" content="Resin OS" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Resin OS: Close More Epoxy Jobs." />
    <meta name="twitter:description" content="Stop writing quotes on paper. Generate interactive proposals, collect deposits securely, and manage your entire epoxy business from one dashboard." />
    <meta name="twitter:image" content="https://resinacademics.com/logo.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- JSON-LD Structured Data — SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Resin OS",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, iOS, Android",
      "url": "https://resinacademics.com",
      "image": "https://resinacademics.com/logo.png",
      "description": "The all-in-one operating system for epoxy contractors to generate quotes, collect payments, and visualize jobs with AI.",
      "offers": {
        "@type": "Offer",
        "price": "39.00",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "seller": {
          "@type": "Organization",
          "name": "Resin OS"
        }
      }
    }
    </script>
  </head>

  <body>
    <div id="root">
      <div id="boot-status" style="min-height:100vh;background:#050505;color:#fff;display:flex;align-items:center;justify-content:center;font:16px system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box">
        Opening Resin OS...
      </div>
    </div>
    <script>
      setTimeout(function () {
        var status = document.getElementById('boot-status');
        if (!status) return;
        status.textContent = 'Resin OS could not start. Please reload or update iOS.';
        var reload = document.createElement('button');
        reload.textContent = 'Reload';
        reload.style.cssText = 'margin-left:12px;padding:10px 16px;background:#78c8ff;color:#000;border:0;border-radius:6px;font:inherit;font-weight:600';
        reload.onclick = function () { location.reload(); };
        status.appendChild(reload);
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
